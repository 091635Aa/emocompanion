<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EmoCompanion · 前端后端一体化</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <h1>EmoCompanion · 前端后端一体化</h1>
  <div class="conn">
    <span id="ttsState" class="pill">TTS: …</span>
    <span id="textState" class="pill">文本引擎: …</span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="voice">语音合成</button>
  <button class="tab" data-tab="text">文本生成</button>
</nav>

<main>
  <!-- ============ 语音合成 ============ -->
  <section id="tab-voice" class="panel active">
    <form id="ttsForm" class="form">
      <div class="row">
        <div class="field">
          <label>音色（voice adapter）</label>
          <select id="voiceAdapter"></select>
        </div>
        <div class="field">
          <label>情感（emotion）</label>
          <select id="emotion"></select>
        </div>
        <div class="field">
          <label>后端（backend）</label>
          <select id="ttsBackend">
            <option value="gguf" selected>gguf（默认，训练音色 LoRA）</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>合成文本</label>
        <textarea id="ttsText" rows="3" placeholder="输入要在EmoCompanion音色下说的话…">哥哥你回来啦</textarea>
      </div>
      <div class="actions">
        <button type="submit" id="ttsBtn" class="primary">合成语音</button>
        <span id="ttsStatus" class="status"></span>
      </div>
    </form>
    <div id="ttsResult" class="result hidden">
      <p class="meta" id="ttsMeta"></p>
      <audio id="ttsAudio" controls></audio>
    </div>
  </section>

  <!-- ============ 文本生成 ============ -->
  <section id="tab-text" class="panel">
    <form id="textForm" class="form">
      <div class="row">
        <div class="field">
          <label>角色（role）</label>
          <input id="textRole" value="default" />
        </div>
        <div class="field">
          <label>max_new</label>
          <input id="textMaxNew" type="number" value="128" min="16" step="16" />
        </div>
        <div class="field">
          <label>temperature</label>
          <input id="textTemp" type="number" value="0.9" min="0" max="2" step="0.1" />
        </div>
        <div class="field">
          <label>top_p</label>
          <input id="textTopP" type="number" value="0.9" min="0" max="1" step="0.05" />
        </div>
      </div>
      <div class="field">
        <label>对话（多轮，JSON messages）</label>
        <textarea id="textMsgs" rows="6"></textarea>
      </div>
      <div class="actions">
        <button type="submit" id="textBtn" class="primary">生成</button>
        <label class="tgl"><input type="checkbox" id="autoTts" /> 对话完成自动转语音（自动识别情感）</label>
        <label class="tgl">后端
          <select id="pipeBackend">
            <option value="gguf" selected>gguf（默认，训练音色 LoRA）</option>
          </select>
        </label>
        <span id="textStatus" class="status"></span>
      </div>
      <div id="pipeRow" class="pipe hidden">
        <span id="pipeMeta" class="meta"></span>
        <audio id="pipeAudio" controls></audio>
      </div>
    </form>
    <div class="chat" id="textOutput"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
